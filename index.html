<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süperr Taco - Dijital Menü</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #d84315;      /* Süperr Taco Turuncusu */
            --primary-light: #ffccbc;
            --secondary: #2e7d32;    /* Meksika Yeşili */
            --bg: #fafafa;
            --text-dark: #1f2937;
            --text-light: #6b7280;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text-dark); }
        
        /* HEADER (ÜST KISIM) */
        header { background: var(--primary); color: white; padding: 30px 20px 40px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(216, 67, 21, 0.3); }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        header p { margin: 5px 0 0 0; font-size: 15px; opacity: 0.9; }

        .container { padding: 20px; max-width: 600px; margin: -25px auto 0 auto; position: relative; }

        /* YÜKLENİYOR EKRANI */
        #loading { text-align: center; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); color: var(--primary); font-weight: bold; }

        /* KATEGORİ BAŞLIKLARI */
        .kategori-baslik { background: white; color: var(--secondary); font-size: 18px; font-weight: 700; padding: 12px 20px; margin: 25px 0 15px 0; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border-left: 5px solid var(--secondary); display: inline-block; }

        /* ÜRÜN KARTLARI */
        .urun-listesi { display: flex; flex-direction: column; gap: 12px; }
        .urun-karti { background: white; padding: 16px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #f3f4f6; transition: 0.2s; }
        .urun-karti:active { transform: scale(0.98); background: #f9fafb; }
        
        .urun-bilgi h3 { margin: 0 0 4px 0; font-size: 16px; font-weight: 700; color: var(--text-dark); }
        .urun-bilgi p { margin: 0; font-size: 13px; color: var(--text-light); }
        
        .urun-fiyat { background: var(--primary-light); color: #bf360c; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 16px; }

        /* ALT BİLGİ */
        footer { text-align: center; padding: 30px 20px; color: var(--text-light); font-size: 13px; }
        footer span { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Süperr Taco</h1>
        <p>Dijital Menü'ye Hoş Geldiniz</p>
    </header>

    <div class="container">
        <div id="loading">Menü Yükleniyor... 🌮</div>
        <div id="menu-container"></div>
    </div>

    <footer>
        Gücünü <span>TapGo</span>'dan alır
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6NWemh-bc9-pbvLC5kHQAYBjPvZdBQeM",
            authDomain: "superrtaco-e790c.firebaseapp.com",
            databaseURL: "https://superrtaco-e790c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "superrtaco-e790c",
            storageBucket: "superrtaco-e790c.firebasestorage.app",
            messagingSenderId: "308330390432",
            appId: "1:308330390432:web:2cefdab4f76ffa668f3ac5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ADMİN PANELİNDEKİ MENÜYÜ ANLIK OLARAK ÇEK
        db.ref('menuUrunleri').on('value', snap => {
            const container = document.getElementById('menu-container');
            const loading = document.getElementById('loading');
            
            if(!snap.exists()) {
                loading.innerText = "Şu an menüde ürün bulunmuyor.";
                return;
            }

            loading.style.display = 'none';
            container.innerHTML = '';
            
            const data = snap.val();
            
            // Veritabanındaki Kategorileri Ekrana Çiz
            for(let kategori in data) {
                // Kategori Başlığı
                container.innerHTML += `<div class="kategori-baslik">${kategori}</div>`;
                
                let urunler = data[kategori];
                let urunListesiHTML = `<div class="urun-listesi">`;
                
                // O kategoriye ait ürünleri listele
                for(let key in urunler) {
                    let u = urunler[key];
                    urunListesiHTML += `
                    <div class="urun-karti">
                        <div class="urun-bilgi">
                            <h3>${u.ad}</h3>
                        </div>
                        <div class="urun-fiyat">${u.fiyat} ₺</div>
                    </div>`;
                }
                urunListesiHTML += `</div>`;
                container.innerHTML += urunListesiHTML;
            }
        });
    </script>
</body>
</html>
