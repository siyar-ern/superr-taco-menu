<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutfak Paneli - TapGo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #e8f5e9; margin: 0; padding: 0; color: #1a1a1a; }
        header { background: #1b5e20; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #baglanti-durumu { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #e8f5e9; }
        .login-box { background: white; padding: 40px 30px; border-radius: 16px; width: 80%; max-width: 320px; text-align: center; border: 2px solid #2e7d32; box-shadow: 0 10px 25px rgba(46,125,50,0.1); }
        .login-box h2 { color: #2e7d32; margin-top: 0; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
        .login-btn { background: #2e7d32; color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        
        #main-screen { display: none; }
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        
        .fis { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 6px solid #d84315; }
        .fis-baslik { background: #fff3e0; padding: 15px; border-bottom: 2px dashed #ddd; display: flex; justify-content: space-between; align-items: center; }
        .fis-baslik h3 { margin: 0; color: #d84315; font-size: 20px; }
        
        .siparis-satir { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; }
        .siparis-satir:last-child { border-bottom: none; }
        .siparis-ad { font-size: 16px; font-weight: 600; color: #2c3e50; }
        
        .miktar-kontrol { display: flex; align-items: center; gap: 8px; background: #f5f5f5; padding: 4px; border-radius: 8px; }
        .btn-miktar { background: white; border: 1px solid #ddd; width: 32px; height: 32px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        .btn-hazir { background: #4caf50; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(76,175,80,0.3); }
        .btn-hazir:active { transform: scale(0.95); }
        
        .bos-ekran { text-align: center; color: #2e7d32; font-size: 20px; margin-top: 50px; grid-column: 1 / -1; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Mutfak Girişi</h2>
            <input type="text" id="kullanici" placeholder="Kullanıcı Adı">
            <input type="password" id="sifre" placeholder="Şifre">
            <button class="login-btn" onclick="girisYap()">Mutfağa Gir</button>
        </div>
    </div>

    <div id="main-screen">
        <header>
            <h2 style="margin:0;">Süperr Taco Mutfak 👨‍🍳</h2>
            <div id="baglanti-durumu">🔴 Bağlanıyor...</div>
        </header>

        <div class="container">
            <div class="grid" id="fis-alani"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6NWemh-bc9-pbvLC5kHQAYBjPvZdBQeM",
            authDomain: "superrtaco-e790c.firebaseapp.com",
            databaseURL: "https://superrtaco-e790c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "superrtaco-e790c",
            storageBucket: "superrtaco-e790c.firebasestorage.app",
            messagingSenderId: "308330390432",
            appId: "1:308330390432:web:2cefdab4f76ffa668f3ac5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let maxMasa = 25; // Varsayılan

        // GİRİŞ: ADMİN PANELİNDEN GELEN ŞİFRELERİ KONTROL ET
        function girisYap() {
            const k = document.getElementById('kullanici').value.trim().toLowerCase();
            const s = document.getElementById('sifre').value.trim();

            db.ref('kullanicilar').once('value', snap => {
                let girisBasarili = false;
                if(snap.exists()) {
                    let users = snap.val();
                    for(let key in users) {
                        if(users[key].kadi === k && users[key].sifre === s && users[key].rol === 'mutfak') {
                            girisBasarili = true; break;
                        }
                    }
                }
                
                if(girisBasarili) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-screen').style.display = 'block';
                    mutfagiBaslat();
                } else {
                    alert("Kullanıcı adı, şifre hatalı veya Mutfak yetkiniz yok!");
                }
            });
        }

        document.getElementById('sifre').addEventListener('keypress', e => { if(e.key === 'Enter') girisYap(); });

        function mutfagiBaslat() {
            db.ref('.info/connected').on('value', snap => {
                document.getElementById('baglanti-durumu').innerHTML = snap.val() === true ? "🟢 Sistem Aktif" : "🔴 Bağlantı Yok";
            });

            // Admin panelinden Masa Sayısını Çek (Mutfak da bilsin)
            db.ref('ayarlar/masaSayisi').on('value', snap => {
                if(snap.exists()) maxMasa = snap.val();
            });

            // Siparişleri Dinle
            db.ref('masalar').on('value', snap => {
                ekranaFisleriCiz(snap.val());
            });
        }

        function ekranaFisleriCiz(masalar) {
            const alan = document.getElementById('fis-alani');
            alan.innerHTML = '';
            let mutfakBos = true;

            if(masalar) {
                for(let i=1; i<=maxMasa; i++) {
                    let masaKey = "masa_" + i;
                    let masa = masalar[masaKey];
                    if(masa && masa.siparisler) {
                        let html = '';
                        for(let key in masa.siparisler) {
                            let s = masa.siparisler[key];
                            if(s.durum === 'bekliyor') {
                                mutfakBos = false;
                                html += `
                                <div class="siparis-satir">
                                    <div style="display:flex; align-items:center; gap: 15px;">
                                        <div class="miktar-kontrol">
                                            <button class="btn-miktar" onclick="miktarDegistir('${masaKey}', '${key}', -1)">-</button>
                                            <span style="font-weight:bold; width:22px; text-align:center; font-size:16px;">${s.adet}</span>
                                            <button class="btn-miktar" onclick="miktarDegistir('${masaKey}', '${key}', 1)">+</button>
                                        </div>
                                        <div class="siparis-ad">${s.ad}</div>
                                    </div>
                                    <button class="btn-hazir" onclick="hazirYaptim('${masaKey}', '${key}')">HAZIR ✅</button>
                                </div>`;
                            }
                        }
                        if(html !== '') {
                            alan.innerHTML += `
                            <div class="fis">
                                <div class="fis-baslik">
                                    <h3>Masa ${i} Siparişi</h3>
                                </div>
                                <div>${html}</div>
                            </div>`;
                        }
                    }
                }
            }
            if(mutfakBos) {
                alan.innerHTML = '<h3 style="color:#2e7d32; text-align:center; grid-column: 1/-1;">Bekleyen Sipariş Yok ✨</h3>';
            }
        }

        function miktarDegistir(masaKey, siparisKey, artis) {
            let masaRef = db.ref('masalar/' + masaKey);
            masaRef.once('value').then(snap => {
                let m = snap.val();
                if(m && m.siparisler && m.siparisler[siparisKey]) {
                    let s = m.siparisler[siparisKey];
                    let yeniAdet = s.adet + artis;
                    if (yeniAdet <= 0) { if(!confirm("Siparişi silmek istiyor musunuz?")) return; }
                    
                    let fiyatFarki = artis * s.fiyat;
                    let yeniToplam = (m.toplamHesap || 0) + fiyatFarki;
                    
                    let updates = { 'toplamHesap': yeniToplam };
                    
                    if (yeniAdet <= 0) {
                        if(Object.keys(m.siparisler).length === 1) updates['durum'] = 'bos';
                        updates['siparisler/' + siparisKey] = null;
                    } else {
                        updates['siparisler/' + siparisKey + '/adet'] = yeniAdet;
                    }
                    masaRef.update(updates);
                }
            });
        }

        function hazirYaptim(masaKey, siparisKey) {
            db.ref('masalar/' + masaKey + '/siparisler/' + siparisKey).update({ durum: 'hazir' });
        }
    </script>
</body>
</html>
