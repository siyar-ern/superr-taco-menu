<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutfak Paneli - TapGo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #e8f5e9; margin: 0; padding: 0; color: #1a1a1a; }
        header { background: #1b5e20; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        #baglanti-durumu { background: white; color: black; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #e8f5e9; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 80%; max-width: 300px; text-align: center; border: 2px solid #2e7d32; }
        .login-box input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .login-btn { background: #2e7d32; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        #main-screen { display: none; }
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .fis { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 6px solid #d84315; }
        .fis-baslik { background: #fff3e0; padding: 15px; border-bottom: 2px dashed #ddd; display: flex; justify-content: space-between; }
        .fis-baslik h3 { margin: 0; color: #d84315; font-size: 20px; }
        
        .siparis-satir { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .siparis-ad { font-size: 16px; font-weight: bold; }
        .siparis-adet { color: #d84315; font-size: 18px; margin-right: 5px; }
        .btn-hazir { background: #4caf50; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color:#2e7d32; margin-top:0;">Mutfak Girişi</h2>
            <input type="text" id="kullanici" placeholder="Kullanıcı Adı">
            <input type="password" id="sifre" placeholder="Şifre">
            <button class="login-btn" onclick="girisYap()">Mutfağa Gir</button>
        </div>
    </div>

    <div id="main-screen">
        <header>
            <h2 style="margin:0;">Süperr Taco Mutfak 👨‍🍳</h2>
            <div id="baglanti-durumu">🔴 Bağlanıyor...</div>
        </header>

        <div class="container">
            <div class="grid" id="fis-alani"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6NWemh-bc9-pbvLC5kHQAYBjPvZdBQeM",
            authDomain: "superrtaco-e790c.firebaseapp.com",
            databaseURL: "https://superrtaco-e790c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "superrtaco-e790c",
            storageBucket: "superrtaco-e790c.firebasestorage.app",
            messagingSenderId: "308330390432",
            appId: "1:308330390432:web:2cefdab4f76ffa668f3ac5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function girisYap() {
            if(document.getElementById('kullanici').value.trim() === 'siyar' && document.getElementById('sifre').value.trim() === 'siyar123') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-screen').style.display = 'block';
                veritabaniniDinle();
            } else { alert("Hatalı Giriş!"); }
        }

        db.ref('.info/connected').on('value', function(snap) {
            document.getElementById('baglanti-durumu').innerHTML = snap.val() === true ? "🟢 Bağlı" : "🔴 Koptu";
        });

        function veritabaniniDinle() {
            db.ref('masalar').on('value', snap => {
                ekranaFisleriCiz(snap.val());
            });
        }

        function ekranaFisleriCiz(masalar) {
            const alan = document.getElementById('fis-alani');
            alan.innerHTML = '';
            let mutfakBos = true;

            if(masalar) {
                for(let i=1; i<=25; i++) {
                    let masaKey = "masa_" + i;
                    let masa = masalar[masaKey];
                    if(masa && masa.siparisler) {
                        let html = '';
                        for(let key in masa.siparisler) {
                            let s = masa.siparisler[key];
                            if(s.durum === 'bekliyor') {
                                mutfakBos = false;
                                html += `
                                <div class="siparis-satir">
                                    <div class="siparis-ad"><span class="siparis-adet">${s.adet}x</span> ${s.ad}</div>
                                    <button class="btn-hazir" onclick="hazirYaptim('${masaKey}', '${key}')">HAZIR ✅</button>
                                </div>`;
                            }
                        }
                        if(html !== '') {
                            alan.innerHTML += `
                            <div class="fis">
                                <div class="fis-baslik">
                                    <h3>Masa ${i}</h3>
                                </div>
                                <div>${html}</div>
                            </div>`;
                        }
                    }
                }
            }
            if(mutfakBos) {
                alan.innerHTML = '<h3 style="color:#2e7d32; text-align:center; grid-column: 1/-1;">Bekleyen Sipariş Yok ✨</h3>';
            }
        }

        function hazirYaptim(masaKey, siparisKey) {
            db.ref('masalar/' + masaKey + '/siparisler/' + siparisKey).update({ durum: 'hazir' });
        }
    </script>
</body>
</html>
